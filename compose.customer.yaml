services:
  engine:
    image: ghcr.io/proxima-engine/proxima-engine:${PROXIMA_ENGINE_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PROXIMA_NODE_ID: ${PROXIMA_NODE_ID:?Set PROXIMA_NODE_ID in .env}
      PROXIMA_NODE_IDENTITY_PATH: /var/lib/proxima/node-identity.json
      PROXIMA_NODE_DATABASE_CONFIG_PATH: /var/lib/proxima/database-targets.json
      PROXIMA_NODE_ENROLLMENT_URL: ${PROXIMA_NODE_ENROLLMENT_URL:-https://api.agataproxima.com/api/v1/nodes/enroll}
      PROXIMA_NODE_HEARTBEAT_URL: ${PROXIMA_NODE_HEARTBEAT_URL:-https://api.agataproxima.com/api/v1/nodes/heartbeat}
      PROXIMA_NODE_ENROLLMENT_TOKEN_FILE: /run/secrets/node_enrollment_token
      PROXIMA_ENVIRONMENT: ${PROXIMA_ENVIRONMENT:-production}
      PROXIMA_LISTEN_ADDR: ${PROXIMA_LISTEN_ADDR:-0.0.0.0:6432}
      PROXIMA_UPSTREAM_ADDR: ${PROXIMA_UPSTREAM_ADDR:?Set PROXIMA_UPSTREAM_ADDR in .env}
      PROXIMA_DASHBOARD_ENABLED: "false"
      PROXIMA_METRICS_LISTEN_ADDR: 127.0.0.1:9090
    ports:
      - "${PROXIMA_BIND_ADDRESS:-127.0.0.1}:6432:6432"
    secrets:
      - node_enrollment_token
    volumes:
      - proxima-node-data:/var/lib/proxima
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid

  mysql-gateway:
    profiles: ["mysql"]
    image: ghcr.io/proxima-engine/proxima-engine:${PROXIMA_ENGINE_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/proxima-mysql-gateway"]
    restart: unless-stopped
    environment:
      PROXIMA_MYSQL_IDENTITY_REGISTRY: /run/secrets/mysql_identity_registry
      PROXIMA_MYSQL_LISTEN_ADDR: 0.0.0.0:3307
      RUST_LOG: ${PROXIMA_MYSQL_RUST_LOG:-info}
    ports:
      - "${PROXIMA_MYSQL_BIND_ADDRESS:-127.0.0.1}:3307:3307"
    secrets:
      - mysql_identity_registry
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid

  redis-gateway:
    profiles: ["redis"]
    image: ghcr.io/proxima-engine/proxima-engine:${PROXIMA_ENGINE_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/proxima-redis-gateway"]
    restart: unless-stopped
    environment:
      PROXIMA_REDIS_IDENTITY_REGISTRY: /run/secrets/redis_identity_registry
      PROXIMA_REDIS_LISTEN_ADDR: 0.0.0.0:6380
      PROXIMA_REDIS_UPSTREAM_ADDR: ${PROXIMA_REDIS_UPSTREAM_ADDR:?Set PROXIMA_REDIS_UPSTREAM_ADDR}
      PROXIMA_REDIS_UPSTREAM_TLS_SERVER_NAME: ${PROXIMA_REDIS_UPSTREAM_TLS_SERVER_NAME:?Set PROXIMA_REDIS_UPSTREAM_TLS_SERVER_NAME}
      PROXIMA_REDIS_UPSTREAM_TLS_CA_FILE: /run/secrets/redis_upstream_ca
      PROXIMA_REDIS_TLS_CERT_FILE: /run/secrets/redis_gateway_cert
      PROXIMA_REDIS_TLS_KEY_FILE: /run/secrets/redis_gateway_key
      PROXIMA_REDIS_MAX_CONNECTIONS: ${PROXIMA_REDIS_MAX_CONNECTIONS:-128}
    ports:
      - "${PROXIMA_REDIS_BIND_ADDRESS:-127.0.0.1}:6380:6380"
    secrets:
      - redis_identity_registry
      - redis_upstream_ca
      - redis_gateway_cert
      - redis_gateway_key
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid

secrets:
  mysql_identity_registry:
    file: ./secrets/mysql-identities.json
  node_enrollment_token:
    file: ./secrets/node_enrollment_token
  redis_identity_registry:
    file: ./secrets/redis-identities.json
  redis_upstream_ca:
    file: ./secrets/redis-upstream-ca.pem
  redis_gateway_cert:
    file: ./secrets/redis-gateway-cert.pem
  redis_gateway_key:
    file: ./secrets/redis-gateway-key.pem

networks:
  default:
    name: ${PROXIMA_DOCKER_NETWORK:-proxima-engine-network}

volumes:
  proxima-node-data:
