name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test engine
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: proxima
          POSTGRES_PASSWORD: proxima-dev-only
          POSTGRES_DB: proxima_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proxima -d proxima_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Test public Engine CLI
        run: python3 -m unittest discover -s tests_cli -v
      - name: Validate customer deployment executor syntax
        run: node --check deployment-executor/receiver.mjs
      - name: Validate customer installer scripts
        run: |
          bash -n install-customer.sh
          bash -n install-deployment-executor.sh
          pwsh -NoProfile -Command '$tokens = $null; $errors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "install-customer.ps1"), [ref]$tokens, [ref]$errors) > $null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
      - name: Validate customer Compose installation contract
        run: |
          mkdir -p secrets
          printf 'test-enrollment-token' > secrets/node_enrollment_token
          printf '0123456789abcdef0123456789abcdef' > secrets/tenant_signing_key
          PROXIMA_NODE_ID=00000000-0000-4000-8000-000000000001 PROXIMA_UPSTREAM_ADDR=127.0.0.1:5432 docker compose -f compose.customer.yaml config --quiet
      - name: Run engine tests
        run: cargo test -p proxima-engine
      - name: Build release engine
        run: cargo build -p proxima-engine --release
      - name: Install PostgreSQL client for acceptance test
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify two-tenant isolation against PostgreSQL
        run: bash scripts/test-two-tenants.sh
      - name: Build container image
        run: docker build -t proxima-engine:ci .
      - name: Verify PgBouncer tenant-pool isolation
        run: bash scripts/test-pgbouncer-pooling.sh
