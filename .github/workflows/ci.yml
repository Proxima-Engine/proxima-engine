name: Rust CI

on:
  push:
    branches: [main, feature/universal-database-gateways, feature/mongodb-enterprise-tenant-isolation, feature/mongodb-cockroachdb-completion, feature/sqlserver-redis-tenant-gateways, feature/sqlite-oracle-native-integrations]
  pull_request:
    branches: [main]
  # One scheduled run per day on the default branch. Keep the schedule
  # lightweight by reusing the same integration matrix as push/PR CI.
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test engine
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: proxima
          POSTGRES_PASSWORD: proxima-dev-only
          POSTGRES_DB: proxima_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proxima -d proxima_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: proxima-mysql-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: proxima-mariadb-ci
        ports:
          - 3308:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mongo:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: proxima-mongo-ci
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --username root --password proxima-mongo-ci --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Test public Engine CLI
        run: python3 -m unittest discover -s tests_cli -v
      - name: Validate customer deployment executor syntax
        run: node --check deployment-executor/receiver.mjs
      - name: Validate customer installer scripts
        run: |
          bash -n install-customer.sh
          bash -n install-deployment-executor.sh
          bash tests/linux-installer-smoke.sh
          pwsh -NoProfile -Command '$tokens = $null; $errors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "install-customer.ps1"), [ref]$tokens, [ref]$errors) > $null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
      - name: Validate customer Compose installation contract
        run: |
          mkdir -p secrets
          printf 'test-enrollment-token' > secrets/node_enrollment_token
          printf 'ci-only-sqlserver-ca' > secrets/sqlserver-tds-upstream-ca.pem
          printf 'ci-only-sqlserver-client-cert' > secrets/sqlserver-tds-client-cert.pem
          printf 'ci-only-sqlserver-client-key' > secrets/sqlserver-tds-client-key.pem
          printf '{"users":[]}' > secrets/mysql-identities.json
          printf '{"users":[{"username":"tenant_a_gateway","tenant_id":"tenant-a","database":"tenant_a_db"}]}' > secrets/mongodb-identities.json
          printf 'ci-only-gateway-cert' > secrets/mongodb-gateway-cert.pem
          printf 'ci-only-gateway-key' > secrets/mongodb-gateway-key.pem
          printf 'ci-only-upstream-ca' > secrets/mongodb-upstream-ca.pem
          printf '{"users":[]}' > secrets/redis-identities.json
          printf 'test-ca' > secrets/redis-upstream-ca.pem
          printf 'test-cert' > secrets/redis-gateway-cert.pem
          printf 'test-key' > secrets/redis-gateway-key.pem
          cat > .env <<'EOF'
          PROXIMA_NODE_ID=00000000-0000-4000-8000-000000000001
          PROXIMA_NODE_ENROLLMENT_URL=https://api.agataproxima.com/api/v1/nodes/enroll
          PROXIMA_UPSTREAM_ADDR=127.0.0.1:5432
          PROXIMA_LISTEN_ADDR=0.0.0.0:6432
          PROXIMA_ENVIRONMENT=production
          PROXIMA_MONGODB_UPSTREAM_ADDR=127.0.0.1:27017
          PROXIMA_MONGODB_UPSTREAM_TLS_SERVER_NAME=localhost
          PROXIMA_REDIS_UPSTREAM_ADDR=redis:6379
          PROXIMA_REDIS_UPSTREAM_TLS_SERVER_NAME=redis
          PROXIMA_SQLSERVER_TDS_LISTEN_ADDR=0.0.0.0:14330
          PROXIMA_SQLSERVER_TDS_ALLOW_NON_LOOPBACK=true
          EOF
          docker compose -f compose.customer.yaml config --quiet
          docker compose -f compose.customer.yaml --profile mongodb config --quiet
      - name: Run engine tests
        run: cargo test -p proxima-engine
      - name: Build release engine
        run: cargo build -p proxima-engine --release
      - name: Build MySQL protocol gateway
        run: cargo build -p proxima-engine --bin proxima-mysql-gateway
      - name: Elasticsearch acceptance script syntax
        run: bash -n scripts/test-elasticsearch-tenant-isolation.sh && bash -n scripts/test-opensearch-tenant-isolation.sh && bash -n scripts/test-dynamodb-leading-keys-aws.sh

      - name: Build MongoDB wire gateway
        run: cargo build -p proxima-engine --bin proxima-mongodb-gateway
      - name: Build Redis RESP2 gateway
        run: cargo build -p proxima-engine --bin proxima-redis-gateway
      - name: Build SQL Server TDS 7.4 gateway
        run: cargo build -p proxima-engine --bin proxima-sqlserver-tds-gateway
      - name: Install database clients for acceptance tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client default-mysql-client netcat-openbsd redis-tools curl gnupg
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /etc/apt/keyrings/microsoft.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
      - name: Verify MySQL 8 and MariaDB tenant isolation
        env:
          MYSQL_ROOT_PASSWORD: proxima-mysql-ci
          MARIADB_ROOT_PASSWORD: proxima-mariadb-ci
        run: bash scripts/test-mysql-gateways-ci.sh
      - name: Verify two-tenant isolation against PostgreSQL
        run: bash scripts/test-two-tenants.sh
      - name: Verify two-tenant isolation against CockroachDB 25.2
        run: bash scripts/test-cockroachdb-tenant-isolation-ci.sh
      - name: Verify SQL Server native tenant database isolation
        env:
          MSSQL_SA_PASSWORD: CI-only-NotASecret-2026!
        run: bash scripts/test-sqlserver-tenant-isolation-ci.sh
      - name: Verify Redis RESP2 gateway tenant isolation
        run: bash scripts/test-redis-tenant-gateway-ci.sh
      - name: Verify Oracle schema-per-tenant isolation
        env:
          ORACLE_PASSWORD: CI-only-Oracle-Password-2026
        run: bash scripts/test-oracle-tenant-isolation-ci.sh
      - name: Verify Cassandra keyspace-per-tenant isolation
        run: bash scripts/test-cassandra-tenant-isolation-ci.sh
      - name: Verify MongoDB tenant database isolation
        env:
          PROXIMA_MONGODB_TEST_URI: mongodb://root:proxima-mongo-ci@127.0.0.1:27017/admin?authSource=admin&directConnection=true
        run: bash scripts/test-mongodb-tenant-isolation-ci.sh
      - name: Build container image
        run: docker build -t proxima-engine:ci .
      - name: Verify packaged gateway executables
        run: docker run --rm --entrypoint /bin/sh proxima-engine:ci -c 'test -x /usr/local/bin/proxima-engine && test -x /usr/local/bin/proxima-mysql-gateway && test -x /usr/local/bin/proxima-mongodb-gateway && test -x /usr/local/bin/proxima-redis-gateway && test -x /usr/local/bin/proxima-sqlserver-tds-gateway'
      - name: Verify PgBouncer tenant-pool isolation
        run: bash scripts/test-pgbouncer-pooling.sh


  windows-installer:
    name: Windows customer installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Parse Windows installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "install-customer.ps1"), [ref]$tokens, [ref]$errors) > $null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Execute Windows installer smoke test with Docker host simulation
        shell: pwsh
        run: ./tests/windows-installer-smoke.ps1
