[databases]
appdb = host=postgres port=5432 dbname=appdb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Local development credentials are stored in pgbouncer-userlist.txt.
; Production deployments must use a managed authentication configuration.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 4096
default_pool_size = 2
reserve_pool_size = 1

; Bound aggregate backend sessions across all tenant-role pools for this
; PgBouncer database alias. Size this against the PostgreSQL connection budget.
max_db_connections = 64
max_db_client_connections = 4096
max_user_connections = 4
max_user_client_connections = 256
query_wait_timeout = 30

; PostgreSQL tenant roles are separate PgBouncer pool identities.
server_reset_query = DISCARD ALL
server_reset_query_always = 1

ignore_startup_parameters = extra_float_digits

log_connections = 1
log_disconnections = 1
