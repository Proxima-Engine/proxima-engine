[package]
name = "opensrv-mysql"
version = "0.7.0-proxima.1"
authors = ["Databend Authors <opensource@datafuselabs.com>", "Proxima Engine contributors"]
edition = "2021"
license = "Apache-2.0"
description = "Proxima-maintained MySQL protocol server shim with caching_sha2_password fast-auth support"

[lib]
doctest = false

[features]
default = []
tls = ["tokio-rustls", "pin-project-lite"]

[dependencies]
async-trait = "0.1.52"
byteorder = "1.4.3"
chrono = "0.4.20"
mysql_common = { version = "0.32.0", features = ["chrono"] }
nom = "7.1.0"
tokio = { version = "1.17.0", features = ["io-util", "io-std"] }
tokio-rustls = { version = "0.26", optional = true }
pin-project-lite = { version = "0.2.9", optional = true }
