[package]
name = "proxima-mysql-gateway"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Isolated MySQL protocol and tenant-boundary gateway primitives for Agata Proxima"

[lib]
path = "src/lib.rs"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.2"
tracing = "0.1"
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
