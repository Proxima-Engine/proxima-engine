[package]
name = "proxima-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Agata Proxima security infrastructure engine"
repository = "https://github.com/Proxima-Engine/proxima-engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bytes = "1"
hmac = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.2"
tokio-rustls = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql", "sqlite"] }
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73"] }
tokio-util = { version = "0.7", features = ["compat"] }
mongodb = "3"
chrono = { version = "0.4", features = ["serde"] }
redis = { version = "0.27", default-features = false, features = ["tokio-rustls-comp"] }
tokio-postgres-rustls = { version = "0.14", features = ["aws-lc-rs", "webpki-roots"] }
sqlparser = "0.64"
webpki-roots = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
serial_test = "3"
