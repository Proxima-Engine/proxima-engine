[package]
name = "proxima-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Agata Proxima security infrastructure engine"
repository = "https://github.com/Agata-Proxima/proxima-engine"

[dependencies]
base64 = "0.22"
async-trait = "0.1"
aws-config = "1"
aws-sdk-iam = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bytes = "1"
hmac = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rustls = { version = "0.23", features = ["ring"] }
ring = "0.17"
rustls-pemfile = "2.2"
tokio-rustls = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["aws-lc-rs"] }
uuid = { version = "1", features = ["v4"] }
opensrv-mysql = { path = "../../vendor/opensrv-mysql", default-features = false, features = ["tls"] }
sqlparser = { version = "0.63", features = ["visitor"] }
sha1 = "0.10"
mysql_async = { version = "0.37.1", features = ["rustls-tls", "ring"] }
futures-util = "0.3"
mongodb = { version = "3.3", default-features = false, features = ["rustls-tls", "bson-2", "compat-3-3-0"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scylla = { version = "1.9", features = ["rustls-023"] }
oracle-rs = "0.1.7"
tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds80"] }
tokio-util = { version = "0.7", features = ["compat"] }
urlencoding = "2"
[dev-dependencies]
proptest = "1"
tempfile = "3"
serial_test = "3"

