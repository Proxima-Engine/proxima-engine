[databases]
; One PgBouncer database alias maps to one upstream database target.
; The 64-session backend budget is intentionally independent of client cardinality.
appdb = host=postgres port=5432 dbname=appdb max_db_connections=64 max_db_client_connections=50000

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 50000
default_pool_size = 2
reserve_pool_size = 1
reserve_pool_timeout = 5
max_user_connections = 4
max_user_client_connections = 256
query_wait_timeout = 30

; PostgreSQL tenant roles are separate pool identities.
; Keep reset semantics to prevent session state crossing tenant sessions.
server_reset_query = DISCARD ALL
server_reset_query_always = 1
ignore_startup_parameters = extra_float_digits
log_connections = 1
log_disconnections = 1
