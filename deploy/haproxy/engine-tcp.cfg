global
    log stdout format raw local0
    maxconn 100000
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    server-state-file /var/lib/haproxy/server-state

defaults
    mode tcp
    load-server-state-from-file global
    log global
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout check 3s

frontend proxima_postgresql
    bind :6432
    default_backend proxima_engine_nodes

backend proxima_engine_nodes
    mode tcp
    balance leastconn
    option tcp-check
    tcp-check connect port 9090
    tcp-check send GET\ /healthz\ HTTP/1.1\r\nHost:\ proxima\r\nConnection:\ close\r\n\r\n
    tcp-check expect rstring ^HTTP/1\.1\ 200
    default-server inter 2s fall 3 rise 2
    # Use stable, node-specific DNS names. Add one server line for every
    # enrolled Engine node; the server name is the value stored in targets.json
    # as haproxy_server_name so the executor drains the correct node.
    server engine-node-01 engine-node-01:6432 check inter 2s fall 3 rise 2
    server engine-node-02 engine-node-02:6432 check inter 2s fall 3 rise 2
