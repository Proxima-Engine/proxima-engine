global
    log stdout format raw local0
    maxconn 100000
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout check 3s

frontend proxima_postgresql
    bind :6432
    default_backend proxima_engine_nodes

backend proxima_engine_nodes
    mode tcp
    balance leastconn
    option tcp-check
    default-server inter 2s fall 3 rise 2
    # Resolve all replicas behind the orchestrator's "engine" service name.
    # Each replica must have its own Engine node identity and persistent state.
    server-template engine 32 engine:6432 check resolvers docker init-addr libc,none

resolvers docker
    nameserver dockerdns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
